plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"

    // Local jar dependencies — Essential Commands + Hurl (for mixin targets)
    modImplementation files("libs/essential_commands-0.38.6-mc1.21.11.jar")
    modImplementation files("libs/hurl-1.0.4-1.21.11.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
